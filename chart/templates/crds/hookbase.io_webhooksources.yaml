apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhooksources.hookbase.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
  labels:
    {{- include "hookbase-operator.labels" . | nindent 4 }}
spec:
  group: hookbase.io
  names:
    kind: WebhookSource
    listKind: WebhookSourceList
    plural: webhooksources
    singular: webhooksource
    shortNames:
      - ws
      - wsrc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source ID
          type: string
          jsonPath: .status.sourceId
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [name]
              x-kubernetes-validations:
                - rule: "(has(self.catalogProvider) ? self.catalogProvider : '') == (has(oldSelf.catalogProvider) ? oldSelf.catalogProvider : '')"
                  message: spec.catalogProvider cannot be added, changed or removed after creation
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                slug:
                  type: string
                  maxLength: 50
                  pattern: '^[a-z0-9-]+$'
                provider:
                  type: string
                  default: generic
                description:
                  type: string
                catalogProvider:
                  type: string
                  maxLength: 100
                signingSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                verifyTokenRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                rejectInvalidSignatures:
                  type: boolean
                verifySignature:
                  type: boolean
                  description: "Deprecated: use rejectInvalidSignatures. Honoured only when rejectInvalidSignatures is unset."
                rateLimitPerMinute:
                  type: integer
                  minimum: 1
                  maximum: 100000
                ipFilterMode:
                  type: string
                  enum: [none, allowlist, denylist, both]
                ipAllowlist:
                  type: array
                  items:
                    type: string
                ipDenylist:
                  type: array
                  items:
                    type: string
                dedupStrategy:
                  type: string
                  enum: [auto, provider_id, payload_hash, idempotency_key, none]
                dedupWindowHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                transientMode:
                  type: boolean
                allowedMethods:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
                apiKeyRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
            status:
              type: object
              properties:
                sourceId:
                  type: string
                ingestUrl:
                  type: string
                provider:
                  type: string
                hasSigningSecret:
                  type: boolean
                verifiesWithoutSecret:
                  type: boolean
                awaitingSigningSecret:
                  type: boolean
                signingSecretRefVersion:
                  type: string
                verifyTokenRefVersion:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                lastSyncTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
