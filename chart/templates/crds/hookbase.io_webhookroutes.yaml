apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhookroutes.hookbase.io
  labels:
    {{- include "hookbase-operator.labels" . | nindent 4 }}
spec:
  group: hookbase.io
  names:
    kind: WebhookRoute
    listKind: WebhookRouteList
    plural: webhookroutes
    singular: webhookroute
    shortNames: [wr, wroute]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Route ID, type: string, jsonPath: .status.routeId}
        - {name: Source, type: string, jsonPath: .spec.sourceRef}
        - {name: Destination, type: string, jsonPath: .spec.destinationRef}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [name, sourceRef, destinationRef]
              properties:
                name: {type: string}
                sourceRef: {type: string}
                destinationRef: {type: string}
                filterRef: {type: string}
                filterConditions:
                  type: array
                  items:
                    type: object
                    required: [field, operator, value]
                    properties:
                      field: {type: string}
                      operator: {type: string}
                      value: {type: string}
                filterLogic: {type: string, default: AND, enum: [AND, OR]}
                transformRef: {type: string}
                schemaRef: {type: string}
                priority: {type: integer}
                isActive: {type: boolean, default: true}
                failoverDestinationRefs: {type: array, items: {type: string}}
                holdOnCircuitOpen: {type: boolean}
                circuitBreaker:
                  type: object
                  properties:
                    failureThreshold: {type: integer}
                    cooldownSeconds: {type: integer}
                    probeSuccessThreshold: {type: integer}
                notifications:
                  type: object
                  properties:
                    onFailure: {type: boolean}
                    onSuccess: {type: boolean}
                    onRecovery: {type: boolean}
                    emails: {type: string}
                apiKeyRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
            status:
              type: object
              properties:
                routeId: {type: string}
                resolvedSourceId: {type: string}
                resolvedDestinationId: {type: string}
                resolvedFilterId: {type: string}
                resolvedTransformId: {type: string}
                resolvedSchemaId: {type: string}
                circuitState: {type: string}
                observedGeneration: {type: integer, format: int64}
                lastSyncTime: {type: string, format: date-time}
                conditions: {type: array, items: {type: object, properties: {type: {type: string}, status: {type: string}, reason: {type: string}, message: {type: string}, lastTransitionTime: {type: string, format: date-time}, observedGeneration: {type: integer, format: int64}}}}
