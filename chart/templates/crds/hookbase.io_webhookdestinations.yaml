apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhookdestinations.hookbase.io
  labels:
    {{- include "hookbase-operator.labels" . | nindent 4 }}
spec:
  group: hookbase.io
  names:
    kind: WebhookDestination
    listKind: WebhookDestinationList
    plural: webhookdestinations
    singular: webhookdestination
    shortNames: [wd, wdest]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Destination ID, type: string, jsonPath: .status.destinationId}
        - {name: Type, type: string, jsonPath: .spec.type}
        - {name: URL, type: string, jsonPath: .spec.url}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [name]
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                type: {type: string, default: http, enum: [http, sqs, eventbridge, servicebus, pubsub, oci_queue, s3, r2, gcs, azure_blob, bridge]}
                url: {type: string}
                method: {type: string, default: POST, enum: [GET, POST, PUT, PATCH, DELETE]}
                headers: {type: object, additionalProperties: {type: string}}
                authType: {type: string, enum: [none, basic, bearer, api_key, custom_header]}
                authSecretRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
                configSecretRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
                bridge:
                  type: object
                  required: [eventTypeSource]
                  properties:
                    eventTypeSource: {type: string, enum: [fixed, field]}
                    eventType: {type: string}
                    eventTypeField: {type: string}
                    eventTypePrefix: {type: string}
                    applicationId: {type: string}
                    allowUnverifiedSources: {type: boolean}
                fieldMapping:
                  type: array
                  items:
                    type: object
                    required: [source, target, type]
                    properties:
                      source: {type: string}
                      target: {type: string}
                      type: {type: string, enum: [string, number, boolean, timestamp, json]}
                      default: {type: string}
                timeoutMs: {type: integer}
                retryCount: {type: integer}
                throttle:
                  type: object
                  properties:
                    mode: {type: string, enum: [off, rate, concurrency]}
                    rateLimit: {type: integer}
                    rateUnit: {type: string, enum: [second, minute, hour]}
                    maxConcurrency: {type: integer}
                    queueLimit: {type: integer}
                useStaticIp: {type: boolean}
                batchSize: {type: integer}
                batchWindowSeconds: {type: integer}
                apiKeyRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
            status:
              type: object
              properties:
                destinationId: {type: string}
                hasSigningSecret: {type: boolean}
                observedGeneration: {type: integer, format: int64}
                lastSyncTime: {type: string, format: date-time}
                conditions: {type: array, items: {type: object, properties: {type: {type: string}, status: {type: string}, reason: {type: string}, message: {type: string}, lastTransitionTime: {type: string, format: date-time}, observedGeneration: {type: integer, format: int64}}}}
