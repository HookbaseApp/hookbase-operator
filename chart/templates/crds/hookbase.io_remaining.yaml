    kind: HookbaseCronJob
    listKind: HookbaseCronJobList
    plural: hookbasecronjobs
    singular: hookbasecronjob
    shortNames: [hcj, hcron]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: CronJob ID, type: string, jsonPath: .status.cronJobId}
        - {name: Schedule, type: string, jsonPath: .spec.cronExpression}
