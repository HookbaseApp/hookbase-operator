{{- if .Values.hookbase.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hookbase-operator.fullname" . }}-bootstrap-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hookbase-operator.labels" . | nindent 4 }}
type: Opaque
data:
  apiKey: {{ .Values.hookbase.apiKey | b64enc }}
{{- end }}
