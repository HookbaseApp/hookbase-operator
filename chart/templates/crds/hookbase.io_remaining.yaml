              type: object
              required: [name, cronExpression, url]
              properties:
                name: {type: string}
                description: {type: string}
                cronExpression: {type: string}
                url: {type: string}
                method: {type: string, default: POST, enum: [GET, POST, PUT, PATCH, DELETE]}
                headers: {type: object, additionalProperties: {type: string}}
                payload: {type: string}
                payloadFrom: {type: object, properties: {name: {type: string}, key: {type: string}}}
                timezone: {type: string, default: UTC}
                timeoutMs: {type: integer}
                isActive: {type: boolean, default: true}
                useStaticIp: {type: boolean}
                notifications: {type: object, properties: {onFailure: {type: boolean}, onSuccess: {type: boolean}, onRecovery: {type: boolean}, emails: {type: string}}}
