---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhooktransforms.hookbase.io
  labels:
    {{- include "hookbase-operator.labels" . | nindent 4 }}
spec:
  group: hookbase.io
  names:
    kind: WebhookTransform
    listKind: WebhookTransformList
    plural: webhooktransforms
    singular: webhooktransform
    shortNames: [wtf, wtrans]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Transform ID, type: string, jsonPath: .status.transformId}
        - {name: Type, type: string, jsonPath: .spec.transformType}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [name, transformType]
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                transformType: {type: string, enum: [jsonata, javascript, mapping]}
                code: {type: string}
                codeFrom: {type: object, properties: {name: {type: string}, key: {type: string}}}
                inputFormat: {type: string, default: json, enum: [json, xml, form, text]}
                outputFormat: {type: string, default: json, enum: [json, xml, form, text]}
                apiKeyRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
            status:
              type: object
              properties:
                transformId: {type: string}
                observedGeneration: {type: integer, format: int64}
                lastSyncTime: {type: string, format: date-time}
                conditions: {type: array, items: {type: object, properties: {type: {type: string}, status: {type: string}, reason: {type: string}, message: {type: string}, lastTransitionTime: {type: string, format: date-time}, observedGeneration: {type: integer, format: int64}}}}
