apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhooktunnels.hookbase.io
  labels:
    {{- include "hookbase-operator.labels" . | nindent 4 }}
spec:
  group: hookbase.io
  names:
    kind: WebhookTunnel
    listKind: WebhookTunnelList
    plural: webhooktunnels
    singular: webhooktunnel
    shortNames: [wt, wtunnel]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Tunnel ID, type: string, jsonPath: .status.tunnelId}
        - {name: Public URL, type: string, jsonPath: .status.publicUrl}
        - {name: Connected, type: string, jsonPath: .status.connectionStatus}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [name, targetPort]
              properties:
                name: {type: string}
                subdomain: {type: string}
                targetPort: {type: integer}
                targetService: {type: string}
                sidecarInjection:
                  type: object
                  required: [deploymentRef]
                  properties:
                    deploymentRef: {type: string}
                    agentImage: {type: string}
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                authTokenSecretRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
                apiKeyRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
            status:
              type: object
              properties:
                tunnelId: {type: string}
                publicUrl: {type: string}
                connectionStatus: {type: string}
                sidecarInjected: {type: boolean}
                observedGeneration: {type: integer, format: int64}
                lastSyncTime: {type: string, format: date-time}
                conditions: {type: array, items: {type: object, properties: {type: {type: string}, status: {type: string}, reason: {type: string}, message: {type: string}, lastTransitionTime: {type: string, format: date-time}, observedGeneration: {type: integer, format: int64}}}}
