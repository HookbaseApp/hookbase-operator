apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhookdestinations.hookbase.io
  labels:
    {{- include "hookbase-operator.labels" . | nindent 4 }}
spec:
  group: hookbase.io
  names:
    kind: WebhookDestination
    listKind: WebhookDestinationList
    plural: webhookdestinations
    singular: webhookdestination
    shortNames: [wd, wdest]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Destination ID, type: string, jsonPath: .status.destinationId}
        - {name: URL, type: string, jsonPath: .spec.url}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [name, url]
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                url: {type: string}
                method: {type: string, default: POST, enum: [GET, POST, PUT, PATCH, DELETE]}
                headers: {type: object, additionalProperties: {type: string}}
                authType: {type: string, enum: [none, basic, bearer, api_key, custom_header]}
                authSecretRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
                timeoutMs: {type: integer}
                retryCount: {type: integer}
                rateLimitPerMinute: {type: integer}
                apiKeyRef: {type: object, properties: {name: {type: string}, key: {type: string}}}
            status:
              type: object
              properties:
                destinationId: {type: string}
                observedGeneration: {type: integer, format: int64}
                lastSyncTime: {type: string, format: date-time}
                conditions: {type: array, items: {type: object, properties: {type: {type: string}, status: {type: string}, reason: {type: string}, message: {type: string}, lastTransitionTime: {type: string, format: date-time}, observedGeneration: {type: integer, format: int64}}}}
