apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hookbase-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hookbase-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hookbase-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hookbase-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hookbase-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ include "hookbase-operator.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- if .Values.controller.leaderElect }}
            - --leader-elect
            {{- end }}
            - --hookbase-base-url={{ .Values.hookbase.baseURL }}
            - --default-agent-image={{ .Values.agent.image }}
            - --reconcile-interval={{ .Values.controller.reconcileInterval }}
            {{- if .Values.webhook.enabled }}
            - --enable-webhooks
            {{- end }}
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.hookbase.apiKey }}
            - name: HOOKBASE_API_KEY
              value: {{ .Values.hookbase.apiKey | quote }}
            {{- else if .Values.hookbase.apiKeySecretRef.name }}
            - name: HOOKBASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hookbase.apiKeySecretRef.name }}
                  key: {{ .Values.hookbase.apiKeySecretRef.key | default "apiKey" }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: 9443
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: cert
          secret:
            secretName: {{ include "hookbase-operator.fullname" . }}-webhook-cert
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
